<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dabali — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
  body { padding-bottom: 0; }
  .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 3rem 1.5rem 5rem; }
  .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; flex-wrap: wrap; gap: 1rem; }
  .admin-header h1 { font-family: var(--serif); font-size: 1.8rem; color: var(--accent); margin: 0; }
  .login-box { max-width: 24rem; margin: 6rem auto; }
  .login-box h1 { font-family: var(--serif); font-size: 1.6rem; margin-bottom: 1.5rem; text-align: center; }
  .admin-table { width: 100%; border-collapse: collapse; margin-bottom: 3rem; font-size: 0.88rem; }
  .admin-table th, .admin-table td { text-align: left; padding: 0.7rem 0.8rem; border-bottom: 1px solid var(--border); }
  .admin-table th { color: var(--muted); font-weight: 500; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .admin-section h2 { font-family: var(--serif); font-size: 1.3rem; margin-bottom: 1rem; }
  .status-pill { padding: 0.2rem 0.6rem; font-size: 0.75rem; border: 1px solid var(--border); }
  .empty-note { color: var(--muted); padding: 2rem 0; text-align: center; font-size: 0.9rem; }
  select.status-select { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 0.3rem 0.5rem; font-family: var(--sans); font-size: 0.8rem; }
</style>
</head>
<body>

<div id="loginView" class="login-box">
  <h1>Dabali — Admin</h1>
  <form id="loginForm" class="form" novalidate>
    <div id="loginError" class="form-error" style="display:none;"></div>
    <label>Email
      <input type="email" id="loginEmail" placeholder="you@example.com">
    </label>
    <label>Password
      <input type="password" id="loginPassword" placeholder="••••••••">
    </label>
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>
</div>

<div id="dashboardView" class="admin-wrap" style="display:none;">
  <div class="admin-header">
    <h1>Dabali — Admin</h1>
    <button id="logoutBtn" class="btn btn-outline">Log out</button>
  </div>

  <div class="admin-section">
    <h2>Reservations</h2>
    <div id="reservationsWrap"><p class="empty-note">Loading…</p></div>
  </div>

  <div class="admin-section">
    <h2>Messages</h2>
    <div id="messagesWrap"><p class="empty-note">Loading…</p></div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
